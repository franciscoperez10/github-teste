<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model e Posicionamento</title>
    <link rel="stylesheet" href="../css/cards.css">
</head>
<body>

    <div class="container">

        <div class="card card-francisco">
            <img
                class="foto"
                src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=600"
                alt="Fotografia de perfil do Francisco"
            >
            <h2>Francisco</h2>
            <p>Gosta de tecnologia, desporto e boas conversas.</p>
        </div>

        <div class="card card-sara">
            <img
                class="foto"
                src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600"
                alt="Fotografia de perfil da Sara"
            >
            <h2>Sara</h2>
            <p>Adora música, viagens e boa comida.</p>
        </div>

        <div class="card card-vitor">
            <img
                class="foto"
                src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=600"
                alt="Fotografia de perfil do Vitor"
            >
            <h2>Vitor</h2>
            <p>É apaixonado por filmes, jogos e tecnologia.</p>
        </div>

    </div>

</body>
</html>
