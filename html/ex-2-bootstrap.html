
<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap - Bad News</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

    <!-- 1. Section transformada em container -->
    <section class="container my-5">

        <!-- 2. H1 com fundo preto, texto branco e centrado -->
        <h1 class="bg-dark text-white text-center p-2 mb-3">
            Bad News
        </h1>

        <!-- 3. Div transformada num alerta amarelo -->
        <div class="alert alert-warning" role="alert">
            You are all going to die!
        </div>

        <!-- 4. Primeiro botão verde -->
        <button type="button" class="btn btn-success">
            Give up and come To Terms With
        </button>

        <!-- 5. Segundo botão vermelho -->
        <button type="button" class="btn btn-danger">
            Continue To Deny and live in a fantasy world
        </button>

    </section>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
